version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bettercv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bettercv
      POSTGRES_USER: ${DB_USER:-bettercv_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/builder-schema.sql:/docker-entrypoint-initdb.d/02-builder-schema.sql
    ports:
      - "5432:5432"
    networks:
      - bettercv-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bettercv_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bettercv-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bettercv
      DB_USER: ${DB_USER:-bettercv_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # Anthropic AI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Email (optional)
      EMAIL_SERVICE: ${EMAIL_SERVICE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@bettercv.com}

      # Security
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SESSION_SECRET: ${SESSION_SECRET}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}

      # IP Filtering (optional)
      ENABLE_IP_WHITELIST: ${ENABLE_IP_WHITELIST:-false}
      IP_WHITELIST: ${IP_WHITELIST:-}
      ENABLE_IP_BLACKLIST: ${ENABLE_IP_BLACKLIST:-false}
      IP_BLACKLIST: ${IP_BLACKLIST:-}

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - bettercv-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: bettercv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - bettercv-network
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  bettercv-network:
    driver: bridge
